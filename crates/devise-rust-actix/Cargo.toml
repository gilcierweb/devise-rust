[package]
name = "devise-rust-actix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Actix Web integration for devise-rust"
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
devise-rust = { path = "../devise-rust" }
# D-14/D-31 posture: actix-web pinned to the 4.12 line (4.13 requires rustc 1.88
# — Pitfall 6 / RESEARCH.md); actix-session 0.11 pairs with it.
actix-web = { version = "~4.12", default-features = false }
actix-session = { version = "0.11", features = ["cookie-session"], default-features = false }
futures-util = { version = "0.3", default-features = false }
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rstest.workspace = true
pretty_assertions.workspace = true
actix-session = { version = "0.11", features = ["cookie-session"], default-features = false }
actix-web = { version = "~4.12", default-features = false, features = ["macros"] }
actix-http = "3"
regex = { workspace = true }
devise-rust-diesel = { path = "../devise-rust-diesel", features = ["sqlite"] }
devise-rust-migrations = { path = "../devise-rust-migrations" }
diesel.workspace = true
diesel-async = { version = "0.6.1", features = ["sqlite", "deadpool"] }

[[test]]
name = "session_bridge"
path = "tests/session_bridge.rs"
harness = true

[[example]]
name = "actix-demo"
path = "examples/actix-demo/main.rs"
