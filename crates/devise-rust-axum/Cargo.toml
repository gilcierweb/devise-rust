[package]
name = "devise-rust-axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Axum integration for devise-rust"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["devise", "authentication", "axum", "web"]
categories = ["authentication"]

[lints]
workspace = true

[features]
# Generic OAuth2 stub provider (D-06) — test-support ONLY. This crate's
# own omniauth_flows integration tests and the actix crate's (via its
# dev-dependency on this crate) enable it; it is never default and no
# non-test code path references the module. `dep:` deps reuse packages
# already resolved in the workspace graph (oauth2 pulls sha2 for PKCE;
# core pulls both for HMAC) — no new registry package enters the build
# (T-09-SC).
test-support = ["dep:sha2", "dep:base64"]

[dependencies]
# `version` alongside `path` is required for publishing: the registry
# cannot resolve a path dependency after upload (publish blocker, D-15).
devise-rust = { path = "../devise-rust", version = "0.1.0" }
# Phase 9 pins (09-RESEARCH.md Standard Stack, package-audit OK):
# - axum 0.8: `{param}` route captures, `FromRequestParts`, `Router::merge`
# - tower-sessions 0.15: facade crate ONLY (never the split -core/-memory-store
#   crates); `signed` enables the signed session cookie; MemoryStore is the
#   D-01 default store
# - tower 0.5: `Layer`/`Service` for DeviseLayer
# - axum-extra 0.12 `cookie` + `cookie-signed`: SignedCookieJar transport
# - oauth2 5.0: generic OAuth2 client (omniauthable, wired in 09-03/09-04)
axum = "0.8"
tower = "0.5"
tower-sessions = { version = "0.15", features = ["signed"] }
oauth2 = "5.0"
axum-extra = { version = "0.12", features = ["cookie", "cookie-signed"] }
# cookie 0.18 is the shared cookie lineage of tower-cookies 0.11 and
# axum-extra 0.12 (no version skew). The direct edge exists only to enable
# `key-expansion`, gating `Key::derive_from` (A3) — neither tower-sessions
# nor axum-extra forwards that feature.
cookie = { version = "0.18", features = ["key-expansion"] }
# Optional, test-support feature only (D-06 stub provider PKCE S256
# verification): both are workspace pins already in the dependency graph.
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
# `sync` on top of the workspace features: AuthProxyHandle is a tokio Mutex so
# the guard may live across `.await` (std Mutex guards are !Send).
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Self-dependency: enables the `test-support` feature for THIS crate's
# own integration tests (dev-dependency features unify into the lib
# build under `cargo test`; the lib gate build never sees them).
devise-rust-axum = { path = ".", features = ["test-support"] }
# axum-demo example persistence (D-18 analogue): diesel over an in-memory
# sqlite pool — zero Docker; the MemoryAdapter oracle stays the unit-speed
# leg and the testcontainers Postgres path stays documented-only.
devise-rust-diesel = { path = "../devise-rust-diesel", version = "0.1.0", features = ["sqlite"] }
devise-rust-migrations = { path = "../devise-rust-migrations", version = "0.1.0" }
diesel.workspace = true
diesel-async = { version = "0.6.1", features = ["sqlite", "deadpool"] }

[[test]]
name = "session_bridge"
path = "tests/session_bridge.rs"
harness = true

[[example]]
name = "axum-demo"
path = "examples/axum-demo/main.rs"
