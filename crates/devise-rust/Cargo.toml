[package]
name = "devise-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
# Package-relative readme: `readme.workspace = true` inherits the
# workspace-root path, which cargo resolves outside the package and warns
# on every packaging run. The explicit in-package path is what
# `cargo package --list` proves.
readme = "README.md"
keywords = ["devise", "authentication", "auth", "sessions"]
categories = ["authentication"]

[lints]
workspace = true

[dependencies]
bcrypt.workspace = true
chrono.workspace = true
hmac.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
rust-i18n.workspace = true
once_cell.workspace = true
async-trait.workspace = true
base64.workspace = true
getrandom.workspace = true
hex.workspace = true
subtle.workspace = true
tera.workspace = true
regex.workspace = true
oauth2.workspace = true

[features]
test-utils = []

[dev-dependencies]
pretty_assertions = "1.4"
tokio = { version = "1", features = ["macros", "rt"] }