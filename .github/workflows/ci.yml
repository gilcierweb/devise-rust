name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # MySQL posture: the `mysql` feature compiles on stable (clippy --all-features)
      # but is excluded from MSRV and CI execution because mysql_async declares no
      # rust_version (assumption A1). MySQL templates ship as CI-pending (D-16).

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all

  test-postgres:
    name: Test Postgres (e2e, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # D-32: one backend-by-database matrix job - the single place to
        # read backend health. The sqlx and sea-orm legs activate when
        # their crates land (06-03 / Phase 7); until then the presence
        # guard skips the leg without masking diesel health.
        backend: [diesel, sqlx, sea-orm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run ${{ matrix.backend }} Postgres e2e tests
        run: |
          if [ ! -d "crates/devise-rust-${{ matrix.backend }}" ]; then
            echo "crates/devise-rust-${{ matrix.backend }} not present yet - skipping leg"
            exit 0
          fi
          cargo test -p devise-rust-${{ matrix.backend }} --features e2e-pg

  test-msrv:
    name: Test MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - name: Install MSRV-pinned lockfile
        run: cp Cargo.lock.msrv Cargo.lock
      - name: Run tests with MSRV
        run: cargo test --all --locked

  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --all