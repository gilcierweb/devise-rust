name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run on the same ref is pointless work (T-10-SC: cancel before
# it burns the cache the new run needs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Swatinem/rust-cache v2.2.0 (SHA-pinned per the supply-chain
      # hygiene rule, T-10-SC): without it every job cold-builds the full
      # dependency tree.
      - uses: Swatinem/rust-cache@9057aaeaa2fc4df01d8f389da99600bed9801508 # v2.2.0
      - name: Check clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # MySQL posture: the `mysql` feature compiles on stable (clippy --all-features)
      # but is excluded from MSRV and CI execution because mysql_async declares no
      # rust_version (assumption A1). MySQL templates ship as CI-pending (D-16).

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9057aaeaa2fc4df01d8f389da99600bed9801508 # v2.2.0
      - name: Run tests
        run: cargo test --all

  test-postgres:
    name: Test Postgres (e2e, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # D-32: one backend-by-database matrix job - the single place to
        # read backend health. Each backend has its own e2e feature name:
        # diesel=e2e-pg, sqlx=e2e-pg-sqlx, sea-orm=e2e-pg-sea.
        include:
          - backend: diesel
            feature: e2e-pg
          - backend: sqlx
            feature: e2e-pg-sqlx
          - backend: sea-orm
            feature: e2e-pg-sea
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9057aaeaa2fc4df01d8f389da99600bed9801508 # v2.2.0
      - name: Run ${{ matrix.backend }} Postgres e2e tests
        run: |
          if [ ! -d "crates/devise-rust-${{ matrix.backend }}" ]; then
            echo "crates/devise-rust-${{ matrix.backend }} not present yet - skipping leg"
            exit 0
          fi
          cargo test -p devise-rust-${{ matrix.backend }} --features ${{ matrix.feature }}

  test-msrv:
    name: Test MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@9057aaeaa2fc4df01d8f389da99600bed9801508 # v2.2.0
      - name: Install MSRV-pinned lockfile
        run: cp Cargo.lock.msrv Cargo.lock
      - name: Run tests with MSRV
        run: cargo test --all --locked
      # No `check` job: clippy --all-targets --all-features builds every
      # target of every feature combination already, so a separate
      # `cargo check --all` was pure duplicate wall-clock.
