name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs (same policy as ci.yml, T-10-SC).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1

jobs:
  docs:
    name: Docs (rustdoc warnings + links + prose lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Swatinem/rust-cache v2.2.0 (SHA-pinned per the supply-chain hygiene
      # rule, T-10-SC): the rustdoc step cold-builds the crate otherwise.
      - uses: Swatinem/rust-cache@9057aaeaa2fc4df01d8f389da99600bed9801508 # v2.2.0
      # D-24: the docs gate is blocking, same as clippy. Broken intra-doc
      # links must fail before the link checker runs (key_links ordering).
      - name: Rustdoc warning free
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      # Pre-publish exclusions (IN-03, gap 5): every docs.rs/devise-rust and
      # crates.io/crates/devise-rust target in the scanned surface (README
      # badge and hub links, guide pages, CHANGELOG) returns 404 until the
      # first crates.io publish exists. Remove BOTH excludes at the publish
      # session once the first crate is live, per the Publish Session
      # Checklist recorded in the project planning artifacts
      # (10-USER-SETUP.md), so this gate resumes checking the real registry
      # targets.
      # The repository's Discussions tab is disabled (404 on every
      # /discussions target, including the README hub link). Drop this
      # exclude at the repo-setup session once Discussions is enabled.
      - name: Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --verbose --no-progress
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude 'https://docs\.rs/devise-rust'
            --exclude 'https://crates\.io/crates/devise-rust'
            --exclude 'https://github\.com/gilcierweb/devise-rust/discussions'
            README.md docs/ CHANGELOG.md
      # D-06 house prose rule: no em dash codepoints in README, guides,
      # changelog, or core rustdoc. grep -P over the U+2014 codepoint.
      - name: House prose rule (no em dashes)
        run: |
          if grep -rnP '\x{2014}' README.md docs CHANGELOG.md crates/devise-rust/src; then
            echo "em dash codepoint found; the house prose rule (D-06) forbids it" >&2
            exit 1
          fi
