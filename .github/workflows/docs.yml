name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1

jobs:
  docs:
    name: Docs (rustdoc warnings + links + prose lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # D-24: the docs gate is blocking, same as clippy. Broken intra-doc
      # links must fail before the link checker runs (key_links ordering).
      - name: Rustdoc warning free
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      # Markdown link check over the hub, the guide corpus, and the
      # changelog. Pinned to the full commit SHA of tag v2 per the
      # supply-chain hygiene rule (T-10-SC); localhost targets are excluded.
      - name: Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --verbose --no-progress
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            README.md docs/ CHANGELOG.md
      # D-06 house prose rule: no em dash codepoints in README, guides,
      # changelog, or core rustdoc. grep -P over the U+2014 codepoint.
      - name: House prose rule (no em dashes)
        run: |
          if grep -rnP '\x{2014}' README.md docs CHANGELOG.md crates/devise-rust/src; then
            echo "em dash codepoint found; the house prose rule (D-06) forbids it" >&2
            exit 1
          fi
