[workspace]
# resolver = "3" enables MSRV-aware dependency resolution (rust-version = "1.85" below),
# so `cargo update` cannot silently pick crates requiring newer rustc.
resolver = "3"
members = [
    "crates/devise-rust",
    "crates/devise-rust-diesel",
    "crates/devise-rust-actix",
    "crates/devise-rust-axum",
    "crates/devise-rust-migrations",
]
exclude = [".tmp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Gilcier <gilcierweb@users.noreply.github.com>"]
description = "Faithful Rust port of the Devise Ruby gem — modular authentication for Rust web applications"
repository = "https://github.com/gilcierweb/devise-rust"
homepage = "https://github.com/gilcierweb/devise-rust"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
bcrypt = "0.19"
chrono = "0.4"
hmac = "0.13"
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde", "fast-rng"] }
# rust-i18n 4.2+ depends on serde-saphyr (rust-version 1.89) which exceeds our MSRV 1.85;
# the 3.1 line (serde_yaml-based) is the newest MSRV-compatible release with the same API.
rust-i18n = "3.1"
once_cell = "1.19"
async-trait = "0.1"
base64 = "0.22"
getrandom = "0.2"
hex = "0.4"
subtle = "2.5"
insta = "1.49"
rstest = "0.27"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
pretty_assertions = "1.4"
diesel = { version = "2.2.12", default-features = false, features = ["chrono", "uuid", "32-column-tables"] }
diesel-async = "0.6.1"
